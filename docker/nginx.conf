# Nginx di dalam container app. TLS ditangani Cloudflare Tunnel di depan,
# jadi di sini cukup HTTP :80 (dipublish ke 127.0.0.1:WEB_PORT di host).
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 20M;
    charset utf-8;

    # Header keamanan global (CSP sengaja belum dipasang: embed YouTube/Instagram,
    # TinyMCE & CDN perlu diuji dulu agar halaman tidak rusak).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 1024;

    # Aset Vite ber-hash: aman di-cache lama.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /storage/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
