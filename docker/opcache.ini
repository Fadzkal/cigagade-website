; Produksi: kode tidak berubah di dalam container, jadi validate_timestamps=0.
; Redeploy = build image baru, cache otomatis bersih.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=96
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.jit=off

expose_php=Off
memory_limit=256M
upload_max_filesize=20M
post_max_size=22M
max_execution_time=60
